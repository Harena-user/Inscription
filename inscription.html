<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inscription</title>

    <link rel="stylesheet" href="inscription.css">
</head>

<body>

    <main class="container">

        <section class="form-card">

            <h1>Inscription</h1>

            <p class="intro">
                Veuillez remplir les informations ci-dessous.
            </p>

            <form id="registrationForm" novalidate>

                <!-- NOM -->
                <div class="form-group">

                    <label for="nom">
                        Nom
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        maxlength="100"
                        autocomplete="family-name"
                        required
                    >

                    <small
                        id="nomError"
                        class="error"
                    ></small>

                </div>

                <!-- PRÉNOM -->
                <div class="form-group">

                    <label for="prenom">
                        Prénom
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        maxlength="100"
                        autocomplete="given-name"
                        required
                    >

                    <small
                        id="prenomError"
                        class="error"
                    ></small>

                </div>

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                        <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="254"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="emailError"
                        class="error"
                    ></small>

                </div>

                <button
                    type="submit"
                    id="submitButton"
                >
                    S'inscrire
                </button>

                <p
                    id="formMessage"
                    class="form-message"
                ></p>

            </form>

        </section>

    </main>

    <script src="inscription.js"></script>

</body>
</html>
